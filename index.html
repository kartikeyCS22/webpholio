<style>
:root{--bg:#FBF6EA;--tx:#0B3B2E;--mu:#4F6B60;--vm:#D6372A;--em:#0F8A5F;--ivory:#FBF6EA;color-scheme:light;box-sizing:border-box}

*{box-sizing:border-box;margin:0}

body{font:500 15px/1.5 "DM Sans",system-ui,sans-serif;color:var(--tx);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px;
background:radial-gradient(700px 500px at 10% 0,color-mix(in srgb,var(--em) 26%,transparent),transparent 65%),radial-gradient(600px 500px at 95% 100%,color-mix(in srgb,var(--vm) 24%,transparent),transparent 65%),var(--bg);background-repeat:no-repeat;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid #FFD36A;outline-offset:3px}
.remote{position:relative;width:min(420px,100%);border-radius:64px;padding:26px 22px 30px;color:var(--ivory);
background:linear-gradient(165deg,#17B07E 0%,#0F8A5F 38%,#0A5C41 100%);border:3px solid #062E22;
box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -10px 20px rgba(0,0,0,.25),0 3px 0 #062E22,0 8px 0 #0A4A35,0 50px 80px -20px rgba(6,46,34,.65);animation:rise .8s cubic-bezier(.2,.9,.2,1) both}
.remote::before{content:"";position:absolute;inset:8px;border-radius:56px;border:1.5px solid rgba(255,255,255,.16);pointer-events:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.led{width:14px;height:14px;border-radius:50%;background:var(--vm);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 14px var(--vm);animation:bl 2.4s infinite}
.led.go{animation:none;background:#FFD36A;box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 22px #FFD36A}
.brand{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-right:auto;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.rb{width:40px;height:40px;border-radius:50%;border:2px solid #062E22;background:linear-gradient(180deg,#FFF8E6,#EADFC2);color:#0B3B2E;display:grid;place-items:center;cursor:pointer;font:700 12px "DM Sans";box-shadow:0 4px 0 #062E22,inset 0 2px 0 #fff;transition:transform .12s,box-shadow .12s}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 #062E22}.rb.on{background:linear-gradient(180deg,#FF7A68,#D6372A);color:#fff}
.lcd{background:linear-gradient(180deg,#06241B,#0A3326);border:3px solid #041A14;border-radius:22px;padding:14px 16px;min-height:104px;box-shadow:inset 0 6px 14px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.2);font:500 13px/1.5 "DM Mono",ui-monospace,monospace;color:#6DF5B6;text-shadow:0 0 8px rgba(109,245,182,.55);margin-bottom:22px;position:relative;overflow:hidden}
.lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.lcd b{display:block;font-size:17px;color:#B8FFDF}.lcd small{display:block;color:#FFD36A;text-shadow:none;font-size:12px}.lcd p{color:#6DF5B6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cur{animation:bl 1s steps(1) infinite}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 14px}
.key{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.soc{width:100%;padding:7px;border-radius:32%;background:#073A2B;box-shadow:inset 0 4px 10px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.25)}
.tile{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:27%;overflow:hidden;border:0;padding:0;cursor:pointer;background:#EADFC2;color:#fff;display:grid;place-items:center;
box-shadow:0 7px 0 rgba(0,0,0,.45),0 14px 18px -4px rgba(0,0,0,.45);transform:translateY(-3px);transition:transform .12s,box-shadow .12s,filter .2s}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.4),transparent 45%);pointer-events:none}
.tile svg{width:44%;height:44%;color:#0B3B2E}
a.tile:hover,button.tile:hover{transform:translateY(-6px);box-shadow:0 10px 0 rgba(0,0,0,.45),0 20px 24px -4px rgba(0,0,0,.5)}
.tile:active{transform:translateY(3px)!important;box-shadow:0 1px 0 rgba(0,0,0,.45)!important}
.tile.off{filter:grayscale(.85) brightness(.8);cursor:not-allowed}
.tile .bdg{position:absolute;right:6px;top:6px;z-index:2;width:24px;height:24px;border-radius:50%;background:var(--vm);display:grid;place-items:center;border:2px solid #fff}.bdg svg{width:12px;height:12px;color:#fff}
.add{background:linear-gradient(145deg,#FFF8E6,#EADFC2);font:800 40px "Bricolage Grotesque";color:#0B3B2E}
.lab{font:700 12px "DM Sans";letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.4);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grille{display:flex;justify-content:center;gap:8px;margin:28px 0 4px}.grille i{width:8px;height:30px;border-radius:5px;background:#063A2B;box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.2)}
.msg{text-align:center;grid-column:1/-1;color:#FFD36A;padding:16px 0}
.foot{margin-top:22px;font-size:13px;color:var(--mu);text-align:center}.foot a{font-weight:700;color:var(--tx);border-bottom:2px solid var(--vm)}
dialog{border:3px solid #062E22;border-radius:26px;background:#FFFDF6;color:#0B3B2E;padding:0;width:min(480px,calc(100vw - 24px));max-height:90vh;overflow:auto;box-shadow:8px 8px 0 var(--vm),0 40px 80px -20px rgba(0,0,0,.5)}
dialog[open]{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}dialog::backdrop{background:rgba(4,26,20,.7)}
form{padding:24px;display:grid;gap:12px}h2{font:800 28px "Bricolage Grotesque"}label{display:grid;gap:3px;font-size:13px;font-weight:700}
.in{width:100%;padding:10px 14px;border-radius:12px;border:2px solid #0B3B2E;background:#fff;color:#0B3B2E;font:inherit;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.in:focus{outline:0;box-shadow:3px 3px 0 var(--em)}.err{color:#B42318;font-size:12px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;border:2px solid #062E22;background:#FFF8E6;color:#0B3B2E;font:700 14px "DM Sans";cursor:pointer;box-shadow:3px 3px 0 #062E22;transition:transform .1s,box-shadow .1s}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #062E22}
.btn.p{background:linear-gradient(180deg,#F0604F,#D6372A);color:#fff}.btn.d{background:#fff;color:#B42318;margin-right:auto}.btn[disabled]{opacity:.5}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:70}
.t{background:#0B3B2E;color:#FBF6EA;padding:11px 18px;border-radius:14px;font-weight:700;border:2px solid var(--vm);animation:pop .3s both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}}@keyframes pop{from{opacity:0;transform:scale(.6)}}@keyframes bl{50%{opacity:.25}}
@media(max-width:380px){.keys{gap:16px 10px}.remote{padding:22px 16px 26px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
.tile,.rb,.btn{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.foot{margin-top:14px;color:rgba(251,246,234,.85);position:relative}.foot a{color:#FBF6EA;border-color:#FFD36A}
@media(hover:none){a.tile:hover,button.tile:hover{transform:translateY(-3px);box-shadow:0 7px 0 rgba(0,0,0,.45),0 14px 18px -4px rgba(0,0,0,.45)}}
@media(max-width:520px){
 body{padding:0;justify-content:flex-start;align-items:stretch}
 .remote{width:100%;min-height:100vh;min-height:100dvh;border-radius:0;border:0;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
 .remote::before{inset:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));border-radius:44px}
 .keys{flex:1;align-content:center;gap:28px 16px}
 .lcd{min-height:116px;font-size:14px}
 .lab{font-size:13px}
 .rb{width:46px;height:46px}
 .grille{margin:22px 0 4px}
 .in{font-size:16px}
 dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:26px 26px 0 0;max-height:92vh;max-height:92dvh}
}

/* ===== v2: boot, standby, search, filters, favorites, shuffle, sound ===== */
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#041A14;--tx:#FBF6EA;--mu:#A9C4B6;color-scheme:dark}}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{background-size:130% 130%,130% 130%,auto;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{background-position:0 0,100% 100%,0 0}to{background-position:35% 25%,65% 75%,0 0}}

.remote{overflow:hidden;animation-fill-mode:backwards;transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.remote::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.13) 50%,transparent 58%) 150% 0/250% 100% no-repeat;animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,55%{background-position:150% 0}100%{background-position:-50% 0}}

/* power led */
.led{display:block;flex:none;border:0;padding:0;cursor:pointer;transition:transform .12s}
.led:active{transform:scale(.8)}
.remote.standby .led{animation:none;background:#4a1d18;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.rb svg{width:18px;height:18px}

/* lcd */
.lcd{margin-bottom:14px}
.lcd b{padding-right:48px;min-height:1.4em}
.lcd p{min-height:1.5em}
.scr{display:block;animation:lcdIn .3s ease-out both}
.scr.q{animation:none}
.scr.boot{animation:crton .7s cubic-bezier(.2,.8,.2,1) both}
.remote.standby .scr{animation:crtoff .5s ease-in forwards}
.eq{position:absolute;right:14px;top:14px;display:flex;gap:3px;align-items:flex-end;height:18px;z-index:1}
.eq i{display:block;width:4px;height:100%;border-radius:1px;background:#6DF5B6;box-shadow:0 0 6px rgba(109,245,182,.7);transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s;animation-duration:.9s}
.eq i:nth-child(3){animation-delay:-.6s;animation-duration:1.3s}
.eq i:nth-child(4){animation-delay:-.2s;animation-duration:.8s}
.eq i:nth-child(5){animation-delay:-.8s}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes lcdIn{from{opacity:0;transform:translateY(3px)}}
@keyframes crton{0%{opacity:0;transform:scaleY(.01) scaleX(.2);filter:brightness(4)}45%{opacity:1;transform:scaleY(.04) scaleX(1);filter:brightness(3)}100%{transform:none;filter:none}}
@keyframes crtoff{0%{transform:none;filter:none}50%{transform:scaleY(.03);filter:brightness(3)}100%{transform:scaleY(0) scaleX(.1);opacity:0}}

/* search + filters */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;transition:opacity .5s,filter .5s}
.srch{flex:1;min-width:0;position:relative;display:block}
.srch svg{position:absolute;left:13px;top:50%;margin-top:-8px;width:16px;height:16px;color:rgba(251,246,234,.7);pointer-events:none}
.srch input{width:100%;height:40px;border-radius:999px;border:2px solid #062E22;background:#073A2B;color:var(--ivory);font:500 14px "DM Sans",system-ui,sans-serif;padding:0 40px 0 38px;box-shadow:inset 0 4px 10px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.25)}
.srch input::placeholder{color:rgba(251,246,234,.6)}
.srch input:focus{outline:0;box-shadow:inset 0 4px 10px rgba(0,0,0,.5),0 0 0 3px #FFD36A}
.srch kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 11px "DM Mono",ui-monospace,monospace;color:rgba(251,246,234,.75);border:1px solid rgba(251,246,234,.35);border-radius:5px;padding:1px 6px;pointer-events:none}
@media(hover:none){.srch kbd{display:none}}
.chips{flex:0 0 100%;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:999px;border:2px solid #062E22;background:rgba(0,0,0,.22);color:var(--ivory);font:700 11px "DM Sans",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #062E22;transition:transform .12s,box-shadow .12s,background .2s,color .2s;touch-action:manipulation}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #062E22}
.chip[aria-pressed=true]{background:#FFD36A;color:#0B3B2E}
.chip em{font:500 11px "DM Mono",ui-monospace,monospace;font-style:normal;opacity:.65;margin-left:7px}
.msg .chip{margin-top:12px}

/* keys */
.keys{transition:opacity .5s,filter .5s}
.remote.standby .keys,.remote.standby .bar{opacity:.25;filter:grayscale(1);pointer-events:none}
.key{position:relative}
.key.still{animation:none}
.ch{margin-top:-4px;font:500 10px "DM Mono",ui-monospace,monospace;letter-spacing:.1em;color:rgba(251,246,234,.72);white-space:nowrap}
.key.dev .ch{color:#FFD36A}
.mini{position:absolute;top:-8px;z-index:3;width:32px;height:32px;padding:0;border-radius:50%;border:2px solid #062E22;background:linear-gradient(180deg,#FFF8E6,#EADFC2);color:#0B3B2E;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #062E22;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);touch-action:manipulation}
.mini svg{width:15px;height:15px}
.fav{left:-8px}.gh{right:-8px}
.fav[aria-pressed=true]{background:linear-gradient(180deg,#FFE48F,#FFC53D)}
.fav[aria-pressed=true] svg{fill:currentColor}
.key:hover .mini,.key:focus-within .mini,.key.fv .fav{opacity:1;transform:none}
@media(hover:none){.gh{opacity:1;transform:none}}
.mini:active{transform:translateY(2px)!important;box-shadow:0 1px 0 #062E22}
.rip{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none;z-index:3;animation:rip .65s ease-out forwards}
@keyframes rip{to{transform:scale(24);opacity:0}}
.key .tile.scan,.key .tile.lit{transform:translateY(-7px);box-shadow:0 11px 0 rgba(0,0,0,.45),0 0 0 4px #FFD36A,0 0 30px 6px rgba(255,211,106,.8)}
.key .tile.lit{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 11px 0 rgba(0,0,0,.45),0 0 0 4px #FFD36A,0 0 12px 2px rgba(255,211,106,.5)}to{box-shadow:0 11px 0 rgba(0,0,0,.45),0 0 0 4px #FFD36A,0 0 36px 9px rgba(255,211,106,.95)}}
.tile.launch{animation:launch .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes launch{35%{transform:translateY(-14px) scale(1.1);filter:brightness(1.4)}}
.tile.nope{animation:nope .4s}
@keyframes nope{20%,60%{transform:translate(-5px,-3px)}40%,80%{transform:translate(5px,-3px)}}
#dice:active svg{transform:rotate(90deg)}
#dice svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

@media(max-width:520px){
 .remote{padding:18px 22px;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));transform:none!important}
 .remote::before{inset:8px;border-radius:44px}
 .keys{gap:30px 16px}
 .srch input{font-size:16px}
}
@media(max-width:380px){.top{gap:8px}}
/* v3: static, bars */
.lcd.snow::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.85;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='1' seed='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23s)'/></svg>");animation:snow .09s steps(3) infinite}
.lcd.snow .scr{opacity:.35}
@keyframes snow{0%{background-position:0 0}33%{background-position:-37px 21px}66%{background-position:19px -43px}100%{background-position:-11px 8px}}
.bars{height:16px;margin-top:6px;border-radius:3px;background:linear-gradient(90deg,#fff 0 14%,#FFD36A 14% 28%,#6DF5B6 28% 43%,#4FA8FF 43% 57%,#D6372A 57% 71%,#B26BFF 71% 86%,#222 86%)}
/* ===== v4: desktop dashboard + living background ===== */
.remote{z-index:2}
#bg,.floor,.side{display:none}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;transition:opacity .6s}
body:has(.remote.standby) #bg,body:has(.remote.standby) .floor{opacity:.18}
.nobg #bg,.nobg .floor{display:none!important}
@media(min-width:700px){#bg{display:block}}
@media(min-width:900px){
 .floor{display:block;position:fixed;left:-25%;right:-25%;bottom:0;height:46vh;pointer-events:none;z-index:0;transform:perspective(500px) rotateX(62deg);transform-origin:50% 100%;transition:opacity .6s;
 background:linear-gradient(color-mix(in srgb,var(--em) 45%,transparent) 1.5px,transparent 1.5px) 0 0/100% 56px,linear-gradient(90deg,color-mix(in srgb,var(--em) 45%,transparent) 1.5px,transparent 1.5px) 0 0/72px 100%;
 -webkit-mask:linear-gradient(transparent,#000 75%);mask:linear-gradient(transparent,#000 75%);animation:flo 2.6s linear infinite}
}
@keyframes flo{to{background-position:0 56px,0 0}}
.pn{border:3px solid #062E22;border-radius:26px;padding:16px 18px;color:var(--ivory);background:linear-gradient(165deg,#12A072,#0A5C41);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 5px 0 #062E22,0 24px 40px -16px rgba(6,46,34,.6)}
.pn.dk{background:linear-gradient(180deg,#06241B,#0A3326);font-family:"DM Mono",ui-monospace,monospace;color:#6DF5B6;text-shadow:0 0 8px rgba(109,245,182,.5)}
.pn h3{font:800 16px "Bricolage Grotesque",sans-serif;letter-spacing:-.01em;margin-bottom:10px}
.pn .big{font:500 44px/1.1 "DM Mono",ui-monospace,monospace;color:#B8FFDF;margin:4px 0}
.dim{font-size:13px;opacity:.8}.pn p.dim{line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:12px}
.stats div{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 4px;box-shadow:inset 0 3px 8px rgba(0,0,0,.35)}
.stats b{display:block;font:800 26px "Bricolage Grotesque",sans-serif;color:#FFD36A}
.li{display:flex;align-items:center;gap:10px;padding:6px;margin:0 -6px;border-radius:16px;color:inherit;text-decoration:none;transition:background .15s,transform .15s}
a.li:hover{background:rgba(255,255,255,.16);transform:translateX(3px)}
.li .th{flex:none;width:34px;height:34px;border-radius:10px;overflow:hidden;background:#EADFC2;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.4)}

<script>
const $=s=>document.querySelector(s),LOGOS={courtrix:'assets/courtrix-logo.png',mausam:'assets/mausam-logo.svg',portfolio:'assets/portpholio-logo.svg'},I={

{id:'courtrix',name:'Courtrix',description:'Badminton tournament manager: brackets, fixtures and live scores.',live_url:'https://batmintontournament.netlify.app/',github_url:'',category:'Sports',status:'Live',icon:'game',thumb:'',tech:[],featured:false,created:1},

{id:'portfolio',name:'Portpholio',description:'My personal portfolio site: projects, skills and contact.',live_url:'https://portpholio225.netlify.app/',github_url:'',category:'Portfolio',status:'Live',icon:'user',thumb:'',tech:[],featured:true,created:3}];

MOON='<svg viewBox="0 0 24 24"><path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/></svg>';
const R=document.documentElement,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const use=n=>(window.claude&&window.claude.use?Promise.resolve(window.claude.use(n)):Promise.resolve(null)).catch(()=>null);
const toast=m=>{const t=document.createElement('div');t.className='t';t.textContent=m;$('#toast').append(t);setTimeout(()=>t.remove(),2600)};

const remote=$('#remote'),lcdEl=$('#lcd'),keys=$('#keys'),chipsEl=$('#chips'),led=$('#led'),qEl=$('#q'),srEl=$('#sr');
let P=[],admin=false,editMode=false,col=null,editing=null,failed=false,armed=false;
let cat='ALL',q='',ready=false,booting=false,anim=2,standby=false,busy=false,showing=false,slideIx=0,sup=false,curId=null;
let favs=new Set(ls.get('wp-fav',[])),cnt=ls.get('wp-cnt',{}),snd=!!ls.get('wp-snd',false);
let gotData;const dataP=new Promise(r=>gotData=r);

/* ---------- sound ---------- */
let ac=null;
function beep(f,d=.05,t='square',v=.03){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 (Array.isArray(f)?f:[f]).forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+i*.07;o.type=t;o.frequency.value=hz;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.02)})}catch(e){}}
const sndB=$('#snd');
const paintSnd=()=>{sndB.innerHTML=svg(snd?'volOn':'volOff');sndB.setAttribute('aria-pressed',String(snd))};
sndB.onclick=()=>{snd=!snd;ls.set('wp-snd',snd);paintSnd();toast(snd?'Sound on':'Sound off');beep([523,784],.07)};paintSnd();

/* ---------- theme ---------- */
function paint(){$('#theme').innerHTML=R.dataset.theme==='dark'?SUN:MOON}paint();
$('#theme').onclick=()=>{R.dataset.theme=R.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('wp-theme',R.dataset.theme)}catch(e){}paint();beep(R.dataset.theme==='dark'?330:660,.06)};
$('#yr').textContent=new Date().getFullYear();
$('#icons').innerHTML=Object.keys(I).map(k=>`<option>${k}</option>`).join('');
$('#dice').innerHTML=svg('dice');$('#qi').innerHTML=svg('search');

/* ---------- lcd ---------- */
let tw=0;
function typeIn(){const id=++tw,els=[...lcdEl.querySelectorAll('[data-t]')];
 if(RM||!els.length){els.forEach(e=>e.textContent=e.dataset.t);return}
 let i=0;const run=()=>{if(id!==tw||i>=els.length)return;const e=els[i],t=e.dataset.t;let n=0;e.textContent='';
  const step=()=>{if(id!==tw)return;n+=2;e.textContent=t.slice(0,n);if(n<t.length)setTimeout(step,13);else{i++;run()}};step()};run()}
const lcd=(h,cls='')=>{lcdEl.innerHTML=`<div class="scr ${cls}"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>${h}</div>`;typeIn()};
const nOpens=()=>Object.values(cnt).reduce((a,b)=>a+(+b||0),0);
function slides(){const n=P.length,now=new Date(),top=[...P].sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0))[0];
 const s=[
  `<b>TAP A LOGO TO OPEN</b><small>${n} CHANNEL${n===1?'':'S'} READY</small><span class="cur">▌</span>`,
  `<b>${esc(now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}</b><small>${esc(now.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}).toUpperCase())}</small><p>${HOVER?'CLICK ★ TO STAR A CHANNEL':'HOLD A LOGO TO STAR IT'}</p>`,
  `<b>${nOpens()} OPENS TODAY · ${favs.size} ★</b><small>${top&&cnt[top.id]?'MOST USED: '+esc(String(top.name).toUpperCase()):'NOTHING OPENED YET'}</small><p>TALLY RESETS EVERY DAY</p>`];
 if(HOVER)s.push(`<b>QUICK KEYS</b><small>/ SEARCH · R SHUFFLE · P POWER</small><p>0-9 CHANNEL · F STAR</p>`);
 return s}
function idle(){if(standby||busy)return;showing=false;curId=null;const s=slides();lcd(s[slideIx%s.length])}
setInterval(()=>{if(standby||busy||showing||document.hidden||!ready)return;slideIx++;idle()},5000);
function info(p){if(standby||busy)return;showing=true;curId=p.id;const c=cnt[p.id]||0;
 lcd(`<b data-t="${esc(String(p.name||'').toUpperCase())}"></b><small>${esc(p.category)} · ${esc(p.status)}${Array.isArray(p.tech)&&p.tech.length?' · '+esc(p.tech.slice(0,3).join('/').toUpperCase()):''}${c?` · OPENED ${c}×`:''}</small><p data-t="${esc(p.description)}"></p>`)}

/* ---------- data helpers ---------- */
const catKey=p=>(p.category||'').trim().toLowerCase();
const cats=()=>{const m=new Map();P.forEach(p=>{const c=(p.category||'').trim();if(c&&!m.has(c.toLowerCase()))m.set(c.toLowerCase(),c)});return[...m.values()]};
const hay=p=>[p.name,p.description,p.category,p.status,...(Array.isArray(p.tech)?p.tech:[])].join(' ').toLowerCase();
function list(){let L=[...P].sort((a,b)=>(favs.has(b.id)-favs.has(a.id))||((a.created||0)-(b.created||0)));
 if(cat==='★')L=L.filter(p=>favs.has(p.id));else if(cat!=='ALL')L=L.filter(p=>catKey(p)===cat.toLowerCase());
 if(q)L=L.filter(p=>hay(p).includes(q));return L}
function chipsView(){const cs=cats(),fc=P.filter(p=>favs.has(p.id)).length;
 if(cat==='★'&&!fc)cat='ALL';
 if(cat!=='ALL'&&cat!=='★'&&!cs.some(c=>c.toLowerCase()===cat.toLowerCase()))cat='ALL';
 const mk=(k,label,n)=>`<button class="chip" data-c="${esc(k)}" aria-pressed="${cat.toLowerCase()===k.toLowerCase()}">${label}<em>${n}</em></button>`;
 chipsEl.hidden=!P.length||(cs.length<2&&!fc);
 chipsEl.innerHTML=mk('ALL','All',P.length)+(fc?mk('★','★ Starred',fc):'')+cs.map(c=>mk(c,esc(c),P.filter(p=>catKey(p)===c.toLowerCase()).length)).join('')}
function bump(p){cnt[p.id]=(cnt[p.id]||0)+1;ls.set('wp-cnt',cnt)}
function toggleFav(id){const p=P.find(x=>x.id===id);favs.has(id)?favs.delete(id):favs.add(id);ls.set('wp-fav',[...favs]);
 beep(favs.has(id)?[660,990]:[440,330],.08,'triangle',.05);navigator.vibrate?.(favs.has(id)?[10,30,10]:10);
 const m=p?(favs.has(id)?'Starred ':'Unstarred ')+p.name:'Updated';toast(m);srEl.textContent=m;anim=0;view()}

/* ---------- render ---------- */
function view(){
 const ae=document.activeElement;let keep=null;
 if(ae&&(keys.contains(ae)||chipsEl.contains(ae))){for(const k of['i','f','e','c'])if(ae.dataset&&ae.dataset[k]!=null){keep=[k,ae.dataset[k]];break}if(ae.id==='addk')keep=['id','addk']}
 const sl=chipsEl.scrollLeft;chipsView();chipsEl.scrollLeft=sl;
 if(!ready){keys.innerHTML='';return}
 const L=list(),a=anim;anim=0;
 keys.innerHTML=L.length||editMode?L.map((p,i)=>{
  const ok=okUrl(p.live_url),img=p.thumb&&(okUrl(p.thumb)||/^assets\//.test(p.thumb))?p.thumb:LOGOS[p.id],dev=/dev/i.test(p.status||''),fv=favs.has(p.id),id=esc(p.id),nm=esc(p.name);
  const inner=(img?`<img src="${esc(img)}" alt="" draggable="false">`:ic(p.icon))+(editMode?`<span class="bdg">${ic('code','')}</span>`:'');
  const tile=editMode?`<button class="tile" data-e="${id}" aria-label="Edit ${nm}">${inner}</button>`
   :ok?`<a class="tile" data-i="${id}" href="${esc(p.live_url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${nm}">${inner}</a>`
   :`<span class="tile off" data-i="${id}" tabindex="0" role="img" aria-label="${nm}: link not set">${inner}</span>`;
  const minis=editMode?'':`<button class="mini fav" data-f="${id}" aria-pressed="${fv}" aria-label="${fv?'Unstar':'Star'} ${nm}">${svg('star')}</button>`
   +(okUrl(p.github_url)?`<a class="mini gh" href="${esc(p.github_url)}" target="_blank" rel="noopener noreferrer" aria-label="Source code for ${nm}">${ic('code')}</a>`:'');
  const delay=a===2?i*90+120:a===1?i*35:0;
  return `<div class="key${fv?' fv':''}${dev?' dev':''}${a?'':' still'}" style="animation-delay:${delay}ms"><div class="soc">${tile}</div>${minis}<span class="lab">${nm}</span><span class="ch">CH ${String(i+1).padStart(2,'0')} · ${dev?'IN DEV':'LIVE'}</span></div>`}).join('')
  +(editMode?`<div class="key${a?'':' still'}"><div class="soc"><button class="tile add" id="addk" aria-label="Add project">+</button></div><span class="lab">Add</span></div>`:'')
  :`<div class="msg">${failed?'Could not load. Refresh to retry.':P.length?'No channels match.<br><button class="chip" id="clr">Clear filters</button>':'No projects yet.'}</div>`;
 if(keep){const sel=keep[0]==='id'?'#'+keep[1]:`[data-${keep[0]}="${CSS.escape(keep[1])}"]`;document.querySelector(sel)?.focus({preventScroll:true})}

}

/* ---------- interactions ---------- */
const pick=e=>{if(standby)return;const t=e.target.closest&&e.target.closest('[data-i]');if(!t)return;
 const p=P.find(x=>x.id===t.dataset.i);if(p&&(curId!==p.id||!showing)){info(p);if(e.type==='pointerover')beep(1400,.012,'square',.01)}};
keys.addEventListener('pointerover',pick);keys.addEventListener('focusin',pick);
keys.addEventListener('pointerleave',idle);
keys.addEventListener('focusout',e=>{if(!keys.contains(e.relatedTarget))idle()});

function ripple(e,t){const r=t.getBoundingClientRect(),s=document.createElement('span');s.className='rip';
 s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';t.append(s);setTimeout(()=>s.remove(),700)}
let lp=0,lx=0,ly=0;
keys.addEventListener('pointerdown',e=>{sup=false;
 const t=e.target.closest('.tile');if(t&&!standby&&!RM)ripple(e,t);
 const a=e.target.closest('a.tile');if(!a||e.button>0)return;
 lx=e.clientX;ly=e.clientY;clearTimeout(lp);lp=setTimeout(()=>{sup=true;toggleFav(a.dataset.i)},520)});
const stopLp=()=>clearTimeout(lp);
['pointerup','pointercancel','pointerleave'].forEach(n=>keys.addEventListener(n,()=>{stopLp();setTimeout(()=>{sup=false},60)}));
keys.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lx,e.clientY-ly)>10)stopLp()});
keys.addEventListener('contextmenu',e=>{if(!HOVER&&e.target.closest('a.tile'))e.preventDefault()});
keys.addEventListener('auxclick',e=>{if(e.button!==1)return;const a=e.target.closest('a.tile');const p=a&&P.find(x=>x.id===a.dataset.i);if(p)bump(p)});

keys.addEventListener('click',e=>{
 const f=e.target.closest('[data-f]');if(f){toggleFav(f.dataset.f);return}
 if(e.target.closest('#clr')){cat='ALL';q='';qEl.value='';anim=1;view();return}
 const a=e.target.closest('a.tile'),ed=e.target.closest('[data-e]');
 if((a||ed)&&sup){sup=false;e.preventDefault();return}
 if(a){const p=P.find(x=>x.id===a.dataset.i);if(!p)return;bump(p);
  navigator.vibrate?.(15);beep([660,990,1320],.07,'square',.035);
  led.classList.add('go');showing=true;lcd(`<b>OPENING ${esc(String(p.name).toUpperCase())} ↗</b><small>NEW TAB · OPEN #${cnt[p.id]}</small>`);
  a.classList.add('launch');setTimeout(()=>a.classList.remove('launch'),600);srEl.textContent='Opening '+p.name;
  setTimeout(()=>{if(!booting)led.classList.remove('go');if(showing&&!busy)idle()},1400)}
 if(ed)open(P.find(p=>p.id===ed.dataset.e));
 if(e.target.closest('#addk'))open();
 const off=e.target.closest('.off');
 if(off){off.classList.remove('nope');void off.offsetWidth;off.classList.add('nope');beep(150,.15,'sawtooth',.04);showing=true;lcd('<b>NO LINK SET YET</b><small>ADD A LIVE URL IN EDIT MODE</small>')}});

chipsEl.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;anim=1;beep(900,.03);snow();view()});
qEl.addEventListener('input',()=>{q=qEl.value.trim().toLowerCase();anim=1;view()});
$('#edit').onclick=()=>{editMode=!editMode;$('#edit').classList.toggle('on',editMode);$('#edit').setAttribute('aria-pressed',editMode);beep(editMode?880:440,.05);anim=1;view()};

/* shuffle */
const clearLit=()=>keys.querySelectorAll('.lit,.scan').forEach(e=>e.classList.remove('lit','scan'));
async function shuffle(){
 if(busy||standby||!ready)return;
 const ks=[...keys.querySelectorAll('a.tile')];
 if(!ks.length){toast('No channels to shuffle');return}
 busy=true;showing=true;clearLit();
 const n=ks.length,t=Math.floor(Math.random()*n),T=RM?0:n*2+t;let prev=null;
 for(let k=0;k<=T;k++){const el=ks[k%n],p=P.find(x=>x.id===el.dataset.i);
  prev&&prev.classList.remove('scan');
  if(k<T){el.classList.add('scan');prev=el;lcd(`<b>▶ ${esc(String(p.name).toUpperCase())}</b><small>SCANNING…</small>`,'q');beep(260+k*28,.04,'square',.03);await wait(60+110*Math.pow(k/T,2))}
  else{el.classList.add('lit');lcd(`<b>LANDED ON ${esc(String(p.name).toUpperCase())}</b><small>TAP THE LOGO TO OPEN</small>`);
   beep([523,659,784,1047],.09,'triangle',.05);navigator.vibrate?.([20,40,20]);srEl.textContent='Landed on '+p.name;el.focus({preventScroll:true})}}
 busy=false;
 setTimeout(()=>{clearLit();if(showing&&!busy)idle()},5500)}
$('#dice').onclick=shuffle;

/* power + boot */
async function boot(){
 booting=true;busy=true;ready=false;led.classList.add('go');
 lcd(`<b data-t="WEBPHOLIO OS 2.0"></b><small>TUNING CHANNELS…</small><p data-t="SELF-TEST OK"></p>`,'boot');
 await Promise.all([wait(RM?200:1500),Promise.race([dataP,wait(6000)])]);
 if(standby){booting=false;busy=false;return}
 lcd(`<b data-t="${P.length} CHANNEL${P.length===1?'':'S'} ONLINE"></b><small>${failed?'NO SIGNAL':'ALL SYSTEMS GO'}</small>`);
 beep([392,523,659],.09,'triangle',.05);
 await wait(RM?100:750);
 led.classList.remove('go');ready=true;anim=2;booting=false;busy=false;view();
}
led.onclick=()=>{if(booting)return;
 if(standby){standby=false;remote.classList.remove('standby');led.setAttribute('aria-pressed','true');beep([262,392,523],.1,'sine',.05);ready=false;view();boot()}
 else{standby=true;remote.classList.add('standby');led.setAttribute('aria-pressed','false');tw++;beep([392,262],.12,'sine',.05);toast('Standby. Press the red light to wake.')}};

/* static, channel entry, secret */
function snow(ms=280){if(RM)return;lcdEl.classList.add('snow');clearTimeout(snow.t);snow.t=setTimeout(()=>lcdEl.classList.remove('snow'),ms)}
let chBuf='',chT=0,ki=0;const KON=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
function chDigit(d){chBuf+=d;clearTimeout(chT);showing=true;lcd(`<b>CH ${chBuf.padEnd(2,'_')}</b><small>TUNING…</small>`,'q');beep(600+ +d*40,.04);
 if(chBuf.length>=2)chGo();else chT=setTimeout(chGo,900)}
function chGo(){clearTimeout(chT);const n=+chBuf;chBuf='';if(n===0)return secret();
 const t=tiles()[n-1];snow();curId=null;
 if(!t){lcd('<b>NO SIGNAL</b><small>CHANNEL NOT FOUND</small>');beep(150,.15,'sawtooth',.04);setTimeout(()=>{showing=false;idle()},1400);return}
 t.focus()}
function secret(){if(busy)return;snow(500);showing=true;curId=null;lcd('<b>★ CH 00 · TEST CARD</b><small>SECRET CHANNEL FOUND</small><div class="bars"></div>');
 beep([392,523,659,784,1047],.08,'triangle',.05);setTimeout(()=>{if(!busy){showing=false;idle()}},5000)}
$('#chup').onclick=()=>{if(standby||busy||!ready)return;const ts=tiles();if(!ts.length)return;const i=Math.min(chIx,ts.length-1);
 snow();beep(880,.04);curId=null;ts[(i+1)%ts.length].focus()};
let chIx=-1;keys.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('.tile'),k=t?tiles().indexOf(t):-1;if(k>=0)chIx=k});

/* keyboard */
const tiles=()=>[...keys.querySelectorAll('.tile')];
document.addEventListener('keydown',e=>{
 if(e.metaKey||e.ctrlKey||e.altKey||dlg.open)return;
 const el=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
 if(typing){if(e.key==='Escape'&&el===qEl){qEl.value='';q='';anim=1;view();qEl.blur()}return}
 const k=e.key.toLowerCase();
 if(k==='p'){led.click();return}
 ki=k===KON[ki]?ki+1:(k===KON[0]?1:0);if(ki===KON.length){ki=0;if(!standby)secret()}
 if(standby)return;
 if(k==='/'){e.preventDefault();qEl.focus();return}
 if(k==='r'){shuffle();return}
 if(k==='m'){sndB.click();return}
 if(k==='t'){$('#theme').click();return}
 if(k==='e'&&admin){$('#edit').click();return}
 if(k==='f'){const t=el.closest&&el.closest('[data-i]');if(t)toggleFav(t.dataset.i);return}
 if(/^[0-9]$/.test(k)){chDigit(k);return}
 const step={arrowleft:-1,arrowright:1,arrowup:-1,arrowdown:1}[k];
 if(step&&(el===document.body||keys.contains(el))){
  const ts=tiles();if(!ts.length)return;e.preventDefault();
  const cols=getComputedStyle(keys).gridTemplateColumns.split(' ').length,d=k.endsWith('left')||k.endsWith('right')?step:step*cols;
  const i=ts.indexOf(el.closest('.tile')||el);
  (i<0?ts[0]:ts[Math.max(0,Math.min(ts.length-1,i+d))]).focus()}});

/* desktop tilt */
if(HOVER&&!RM&&matchMedia('(min-width:521px)').matches){
 remote.addEventListener('pointermove',e=>{const r=remote.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  remote.style.setProperty('--ry',(x*5).toFixed(2)+'deg');remote.style.setProperty('--rx',(-y*4).toFixed(2)+'deg')});
 remote.addEventListener('pointerleave',()=>{remote.style.setProperty('--ry','0deg');remote.style.setProperty('--rx','0deg')})}

/* ---------- add / edit dialog (unchanged) ---------- */
const F=$('#f'),dlg=$('#dlg');
function open(p){editing=p||null;armed=false;F.reset();$('#ft').textContent=p?'Edit Project':'Add Project';$('#del').hidden=!p;$('#del').textContent='Delete';
 F.querySelectorAll('.err').forEach(e=>e.textContent='');
 if(p)['name','description','live_url','github_url','category','status','icon'].forEach(k=>F[k].value=p[k]||'');if(p)F.thumb.value=p.thumb||'';F.tech.value=p&&Array.isArray(p.tech)?p.tech.join(', '):'';
 dlg.showModal()}
$('#cancel').onclick=()=>dlg.close();
$('#del').onclick=async()=>{if(!armed){armed=true;$('#del').textContent='Tap again to confirm';return}
 try{await col.doc(editing.id).delete();toast('Project deleted');dlg.close()}catch{toast('Delete failed')}};
F.onsubmit=async e=>{e.preventDefault();let bad=false;
 const chk=(n,ok,m)=>{F[n].parentElement.querySelector('.err').textContent=ok?'':m;if(!ok)bad=true},v=n=>F[n].value.trim();
 chk('name',v('name'),'Name is required');chk('description',v('description'),'Description is required');chk('category',v('category'),'Category is required');
 ['live_url','github_url','thumb'].forEach(n=>chk(n,!v(n)||okUrl(v(n)),'Enter a valid http(s) URL'));
 if(bad)return;$('#save').disabled=true;
 const{id,...old}=editing||{};
 const d={tech:[],featured:false,...old,name:v('name'),description:v('description'),live_url:v('live_url'),github_url:v('github_url'),category:v('category'),status:F.status.value,icon:F.icon.value,thumb:v('thumb'),tech:v('tech').split(',').map(s=>s.trim()).filter(Boolean),created:editing?editing.created:Date.now()};
 try{editing?await col.doc(editing.id).set(d):await col.add(d);toast(editing?'Project updated':'Project added');dlg.close()}
 catch{toast('Save failed — no permission')}$('#save').disabled=false};

/* ===== v4: desktop dashboard + living background ===== */
const today=()=>new Date().toDateString();
function dayCheck(){if(ls.get('wp-day','')===today())return false;cnt={};ls.set('wp-cnt',cnt);ls.set('wp-day',today());return true}
dayCheck();
setInterval(()=>{if(dayCheck()){side();if(!standby&&!busy&&!showing)idle()}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&dayCheck()){side();if(!standby&&!busy&&!showing)idle()}});
let rec=ls.get('wp-rec',[]),bgOn=ls.get('wp-bg',true);
const sl=$('#sl'),sr2=$('#sr2'),cv=$('#bg'),cx=cv.getContext('2d'),mqB=matchMedia('(min-width:700px)');
const thumb=p=>{const g=p.thumb&&(okUrl(p.thumb)||/^assets\//.test(p.thumb))?p.thumb:LOGOS[p.id];return g?`<img src="${esc(g)}" alt="" draggable="false">`:ic(p.icon)};
const li=p=>okUrl(p.live_url)?`<a class="li" data-p="${esc(p.id)}" href="${esc(p.live_url)}" target="_blank" rel="noopener noreferrer"><span class="th">${thumb(p)}</span><span class="nm">${esc(p.name)}</span><em>${esc(p.category)}</em></a>`:`<span class="li"><span class="th">${thumb(p)}</span><span class="nm">${esc(p.name)}</span><em>no link</em></span>`;
function tick(){const c=$('#clk');if(!c)return;const n=new Date();c.textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#dt').textContent=n.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}
setInterval(tick,1000);
function side(){if(!matchMedia('(min-width:1100px)').matches)return;
 const st=P.filter(p=>favs.has(p.id)),rc=rec.map(id=>P.find(p=>p.id===id)).filter(Boolean).slice(0,4),h=new Date().getHours(),
 gr=h<5?'Still up?':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
 sl.innerHTML=`<section class="pn dk"><span class="dim">${gr}</span><div class="big" id="clk"></div><div class="dim" id="dt"></div></section>
 <section class="pn"><h3>Today's tally</h3><div class="stats"><div><b>${P.length}</b>channels</div><div><b>${nOpens()}</b>opens today</div><div><b>${favs.size}</b>starred</div></div></section>
 <section class="pn"><h3>Starred</h3>${st.length?st.map(li).join(''):'<p class="dim">Hover a logo and press the star to pin it here.</p>'}</section>`;
 sr2.innerHTML=`<section class="pn"><h3>Recently opened</h3>${rc.length?rc.map(li).join(''):'<p class="dim">Open a project and it shows up here.</p>'}</section>
 <section class="pn"><h3>Shortcuts</h3><div class="ks"><kbd>/</kbd>Search<kbd>R</kbd>Shuffle<kbd>F</kbd>Star focused logo<kbd>0-9</kbd>Jump to channel<kbd>T</kbd>Theme<kbd>B</kbd>Background motion<kbd>C</kbd>Colour skin<kbd>P</kbd>Power</div></section>
 <section class="pn"><h3>Controls</h3><div class="row2"><button class="chip" id="shf">Shuffle</button><button class="chip" id="skn">Skin: ${SK[skin]}</button><button class="chip" id="bgt" aria-pressed="${bgOn}">Motion</button></div></section>`;tick()}
[sl,sr2].forEach(a=>{a.addEventListener('click',e=>{const l=e.target.closest('[data-p]');
  if(l){const p=P.find(x=>x.id===l.dataset.p);if(p){bump(p);beep([660,990],.07,'square',.035)}return}
  if(e.target.closest('#shf'))shuffle();if(e.target.closest('#bgt'))wpBg();if(e.target.closest('#skn'))wpSkin()});
 a.addEventListener('pointerover',e=>{const l=e.target.closest('[data-p]'),p=l&&P.find(x=>x.id===l.dataset.p);if(p&&(curId!==p.id||!showing))info(p)});
 a.addEventListener('pointerleave',idle)});
const _view=view;view=function(){_view();side()};
const _bump=bump;bump=function(p){dayCheck();_bump(p);rec=[p.id,...rec.filter(x=>x!==p.id)].slice(0,6);ls.set('wp-rec',rec);setTimeout(side,60)};

/* background: drifting keys, signal rings, mouse parallax */
let W=0,H=0,S=[],mx=-999,my=-999,raf=0,pulse=-1e5;
const PAL={dark:['251,246,234','255,211,106','109,245,182','255,122,104'],light:['11,59,46','15,138,95','214,55,42','176,120,0']},GL=['▶','★','●','♪'];
function mk(init){const z=.4+Math.random()*.9,k=Math.random();return{x:Math.random()*W,y:init?Math.random()*H:H+90,s:26+z*60,z,vy:-(.12+Math.random()*.35)*(.5+z),vx:(Math.random()-.5)*.2,r:Math.random()*6.28,vr:(Math.random()-.5)*.006,c:Math.floor(Math.random()*4),k:k<.4?0:k<.7?1:2,g:Math.random()<.4?'CH '+String(1+Math.floor(Math.random()*9)).padStart(2,'0'):GL[Math.floor(Math.random()*4)],ox:0,oy:0}}
function fit(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);S=Array.from({length:Math.round(Math.max(10,Math.min(30,W/60)))},()=>mk(1))}
function frame(t){raf=requestAnimationFrame(frame);if(document.hidden)return;
 const dk=R.dataset.theme==='dark',pal=PAL[dk?'dark':'light'],A=dk?1:1.3,r=remote.getBoundingClientRect(),cX=r.left+r.width/2,cY=r.top+r.height/2,M=Math.max(W,H);cx.clearRect(0,0,W,H);
 cx.lineWidth=2;for(let i=0;i<3;i++){const p=((t/5200)+i/3)%1;cx.strokeStyle=`rgba(${pal[2]},${(1-p)*.24*A})`;cx.beginPath();cx.arc(cX,cY,200+p*M*.6,0,6.283);cx.stroke()}
 const pp=(t-pulse)/1400;if(pp>0&&pp<1){cx.strokeStyle=`rgba(${pal[1]},${(1-pp)*.55})`;cx.lineWidth=4;cx.beginPath();cx.arc(cX,cY,150+pp*M*.7,0,6.283);cx.stroke();cx.lineWidth=2}
 for(const o of S){o.x+=o.vx;o.y+=o.vy;o.r+=o.vr;if(o.y<-120)Object.assign(o,mk(0));
  const px=o.x+(mx-W/2)*.03*o.z,py=o.y+(my-H/2)*.03*o.z,dx=px-mx,dy=py-my,d=Math.hypot(dx,dy)||1,f=d<170?(170-d)/170*46:0;
  o.ox+=(dx/d*f-o.ox)*.08;o.oy+=(dy/d*f-o.oy)*.08;
  const a=(.09+.16*o.z*(f?1.5:1))*A,col=pal[o.c],h=o.s/2;
  cx.save();cx.translate(px+o.ox,py+o.oy);cx.rotate(o.r);cx.beginPath();cx.roundRect?cx.roundRect(-h,-h,o.s,o.s,o.s*.27):cx.rect(-h,-h,o.s,o.s);
  if(o.k===1){cx.fillStyle=`rgba(${col},${a*.5})`;cx.fill()}cx.strokeStyle=`rgba(${col},${a})`;cx.stroke();
  if(o.k===2){cx.fillStyle=`rgba(${col},${a*1.6})`;cx.font=`500 ${Math.round(o.s*(o.g.length>2?.22:.42))}px "DM Mono",monospace`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(o.g,0,1)}
  cx.restore()}}
function runBg(){cancelAnimationFrame(raf);R.classList.toggle('nobg',!bgOn||RM);if(bgOn&&!RM&&mqB.matches){fit();raf=requestAnimationFrame(frame)}else cx.clearRect(0,0,cv.width,cv.height)}
function wpBg(){bgOn=!bgOn;ls.set('wp-bg',bgOn);runBg();toast(bgOn?'Background motion on':'Background motion off');side()}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{runBg();side()},150)});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
document.addEventListener('pointerleave',()=>{mx=my=-999});
document.addEventListener('click',e=>{if(e.target.closest('a.tile,[data-p]'))pulse=performance.now()});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||dlg.open||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;if(e.key.toLowerCase()==='b'&&!standby)wpBg()});
const SK=['emerald','ocean','sunset','violet'];let skin=Math.max(0,SK.indexOf(ls.get('wp-skin','emerald')));
const applySkin=()=>{skin?R.dataset.skin=SK[skin]:delete R.dataset.skin};
function wpSkin(){skin=(skin+1)%SK.length;ls.set('wp-skin',SK[skin]);applySkin();snow(220);beep([523,659,784],.06,'triangle',.04);toast('Skin: '+SK[skin]);side()}
addEventListener('pointermove',e=>{const sp=$('#spot');sp.style.setProperty('--mx',e.clientX+'px');sp.style.setProperty('--my',e.clientY+'px')},{passive:true});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||dlg.open||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;if(e.key.toLowerCase()==='c'&&!standby)wpSkin()});
applySkin();
runBg();side();

/* ---------- start ---------- */
(async()=>{
 boot();
 const user=await use('user');admin=!!(user&&user.canEdit());$('#edit').hidden=!admin;
 const db=await use('db');
 if(!db){P=DEFAULTS.map(d=>({...d}));failed=false;gotData();view();return}
 col=db.collection('projects');
 col.onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));failed=false;gotData();view()},()=>{P=DEFAULTS.map(d=>({...d}));failed=false;gotData();view()});
})();
</script>

</body></html>
